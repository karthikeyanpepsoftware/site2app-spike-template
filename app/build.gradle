plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def appProps = rootProject.file("gradle.properties").with { f ->
    def p = new Properties()
    f.withInputStream { p.load(it) }
    p
}

android {
    namespace 'com.site2app.spike'
    compileSdk 34

    defaultConfig {
        applicationId appProps.getProperty('applicationId')
        minSdk 24
        targetSdk 34
        versionCode appProps.getProperty('versionCode').toInteger()
        versionName appProps.getProperty('versionName')
    }

    signingConfigs {
        release {
            storeFile file("/tmp/keystore.p12")
            storePassword System.getenv("STORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: "upload"
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
